{% extends "base.html" %}
{% block title %}Images to PDF{% endblock %}
{% block content %}
<section class="hero"><div><h2>Images to PDF</h2><p>Combine images into one PDF.</p></div></section>
<section class="card">
    <div class="upload"><h3>Upload Images</h3><p>Choose one or more image files.</p><label class="choose">Choose Images<input type="file" id="imagesFile" accept="image/*" multiple></label><div class="file-name" id="imagesFileName"></div></div>
    <button class="primary-btn" type="button" id="imagesPdfBtn" data-action style="margin-top:18px;">Create PDF</button>
</section>
{% endblock %}
{% block scripts %}
<script>
bindFileName('imagesFile','imagesFileName',isImageFile,'images selected');
document.getElementById('imagesPdfBtn').addEventListener('click',()=>{const files=document.getElementById('imagesFile').files;if(!validateFiles(files,isImageFile,1)){alert('Please select image files first!');return;}const formData=new FormData();Array.from(files).forEach((file)=>formData.append('files',file));downloadFromForm('/images-to-pdf',formData,'Creating PDF...','images.pdf');});
</script>
{% endblock %}

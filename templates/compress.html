{% extends "base.html" %}
{% block title %}Compress PDF{% endblock %}
{% block content %}
<section class="hero"><div><h2>Compress PDF</h2><p>Compress PDF content streams where possible.</p></div></section>
<section class="card">
    <div class="upload"><h3>Upload PDF</h3><p>Choose one PDF file.</p><label class="choose">Choose PDF<input type="file" id="compressFile" accept=".pdf"></label><div class="file-name" id="compressFileName"></div></div>
    <button class="primary-btn" type="button" id="compressBtn" data-action style="margin-top:18px;">Compress PDF</button>
</section>
{% endblock %}
{% block scripts %}
<script>
bindFileName('compressFile','compressFileName',isPdfFile,'PDF files selected');
document.getElementById('compressBtn').addEventListener('click',()=>{const file=document.getElementById('compressFile').files[0];if(!file || !isPdfFile(file)){alert('Please select PDF first!');return;}const formData=new FormData();formData.append('file',file);downloadFromForm('/compress',formData,'Compressing PDF...','compressed_pdf.pdf');});
</script>
{% endblock %}

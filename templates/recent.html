{% extends "base.html" %}
{% block title %}Recent Outputs{% endblock %}
{% block content %}
<section class="hero"><div><h2>Recent Outputs</h2><p>Download files generated by the tools.</p></div><button class="secondary-btn" type="button" id="refreshRecentBtn">Refresh</button></section>
<section class="card"><div class="recent-list" id="recentList"></div></section>
{% endblock %}
{% block scripts %}
<script>
async function loadRecent(){try{const response=await fetch('/recent');const files=await response.json();const list=document.getElementById('recentList');list.innerHTML='';if(!files.length){list.innerHTML='<div class="field">No outputs yet.</div>';return;}files.forEach((file)=>{const item=document.createElement('div');item.className='recent-item';const link=document.createElement('a');link.href=file.url;link.textContent=file.name;const meta=document.createElement('span');meta.className='meta';meta.textContent=`${formatBytes(file.size)} - ${file.created}`;item.append(link,meta);list.appendChild(item);});}catch(err){document.getElementById('recentList').innerHTML='<div class="field">Recent outputs load nahi hue.</div>';}}
document.getElementById('refreshRecentBtn').addEventListener('click',loadRecent);
loadRecent();
</script>
{% endblock %}

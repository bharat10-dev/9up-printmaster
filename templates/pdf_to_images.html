{% extends "base.html" %}
{% block title %}PDF to Images{% endblock %}
{% block content %}
<section class="hero"><div><h2>PDF to Images</h2><p>Export selected PDF pages as PNG or JPG files inside a zip.</p></div></section>
<section class="card">
    <div class="upload"><h3>Upload PDF</h3><p>Choose one PDF file.</p><label class="choose">Choose PDF<input type="file" id="pdfImageFile" accept=".pdf"></label><div class="file-name" id="pdfImageFileName"></div></div>
    <div class="form-grid">
        <div class="field"><label for="pdfImageRange">Pages</label><input class="input" type="text" id="pdfImageRange" placeholder="Blank for all"></div>
        <div class="field"><label for="imageFormat">Image Format</label><select class="select" id="imageFormat"><option value="png">PNG</option><option value="jpg">JPG</option></select></div>
    </div>
    <button class="primary-btn" type="button" id="pdfImagesBtn" data-action style="margin-top:18px;">Export Images</button>
</section>
{% endblock %}
{% block scripts %}
<script>
bindFileName('pdfImageFile','pdfImageFileName',isPdfFile,'PDF files selected');
document.getElementById('pdfImagesBtn').addEventListener('click',()=>{const file=document.getElementById('pdfImageFile').files[0];if(!file || !isPdfFile(file)){alert('Please select PDF first!');return;}const formData=new FormData();formData.append('file',file);formData.append('page_range',document.getElementById('pdfImageRange').value.trim());formData.append('image_format',document.getElementById('imageFormat').value);downloadFromForm('/pdf-to-images',formData,'Exporting images...','pdf_images.zip');});
</script>
{% endblock %}
